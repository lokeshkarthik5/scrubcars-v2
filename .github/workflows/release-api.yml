# Releases the API (scrubcars-v2 → api.detlio.com): database migrations first,
# then the production deploy, and only after E2E has passed on main.
#
#   push to main → E2E → [this] gate → migrate → build → deploy
#
# Order is the point. Vercel's Git integration no longer deploys the API from
# main (see `git.deploymentEnabled` in apps/server/vercel.json), so code that
# needs a new column can't go live before the column exists, and a failed
# migration stops the release. Preview deployments for branches are unchanged,
# and the three frontends still deploy straight from Git — they never touch the
# database.
#
# This only orders *additive* changes. Dropping or renaming something the
# running code uses still takes two releases: stop using it, then drop it.
#
# Migrations run with apps/server/scripts/migrate.sh — the same runner as
# `bun run migrate` and the E2E harness. Nothing here calls drizzle-kit.
name: Release API

on:
  workflow_run:
    workflows: [E2E]
    types: [completed]
    branches: [main]
  # Re-run a release by hand — after fixing a failed migration, or when the
  # release for main's tip was skipped. Skips the E2E gate, so use it for main
  # only once E2E is known to be green there.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      release: ${{ steps.decide.outputs.release }}
      sha: ${{ steps.decide.outputs.sha }}
    steps:
      - name: Decide whether to release
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          E2E_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          E2E_EVENT: ${{ github.event.workflow_run.event }}
          E2E_SHA: ${{ github.event.workflow_run.head_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          skip() { echo "::notice::Not releasing: $*"; echo "release=false" >> "$GITHUB_OUTPUT"; exit 0; }

          if [ "$EVENT" = "workflow_dispatch" ]; then
            [ "$REF" = "refs/heads/main" ] || { echo "::error::Run this workflow on main"; exit 1; }
            sha="$GITHUB_SHA"
          else
            # A pull-request E2E run or a manual full-suite run is not a merge.
            [ "$E2E_EVENT" = "push" ] || skip "E2E was triggered by ${E2E_EVENT}, not a push to main"
            [ "$E2E_CONCLUSION" = "success" ] || skip "E2E concluded ${E2E_CONCLUSION} for ${E2E_SHA}"
            sha="$E2E_SHA"
          fi

          # Only ever release main's tip. An older commit finishing E2E late must
          # never replace a newer deploy; the newer commit's own E2E run will
          # release it — and everything before it.
          tip="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)"
          [ "$sha" = "$tip" ] || skip "${sha} is no longer the tip of main (${tip}); that commit's release will follow"

          echo "Releasing ${sha}"
          echo "release=true" >> "$GITHUB_OUTPUT"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"

  release:
    needs: gate
    if: needs.gate.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Never cancel a release in flight, and never run two at once: a newer one
    # queues behind it (GitHub keeps only the newest queued run, which is the
    # one that matters).
    concurrency:
      group: release-api
      cancel-in-progress: false
    # Repository secrets: environment secrets and required reviewers need a
    # paid GitHub plan for a private repo. Repository secrets are readable by
    # any workflow that runs in this repo (never by fork PRs), so only add
    # workflows here that you would trust with production credentials.
    env:
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.sha }}

      - name: Check secrets
        run: |
          missing=""
          for name in DIRECT_URL VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets (Settings → Secrets and variables → Actions):${missing}"
            exit 1
          fi

      # ── 1. Migrate ────────────────────────────────────────────────────────

      - name: Install psql
        # The runner shells out to psql. jq (already on the image) is required
        # for the journal check.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Validate migrations
        # File checks plus the ones that need the database: checksums of
        # applied files (catches an edited migration) and applied migrations
        # whose file has been deleted. Fails before anything is applied.
        run: bash apps/server/scripts/migrate.sh check

      - name: Pending migrations
        run: bash apps/server/scripts/migrate.sh status

      - name: Apply migrations
        run: bash apps/server/scripts/migrate.sh migrate

      # ── 2. Build ──────────────────────────────────────────────────────────
      #
      # Built here and uploaded with --prebuilt, so Vercel runs no build of its
      # own — and so no Ignored Build Step can cancel a release. Framework,
      # root directory and env vars all come from the live project settings via
      # `vercel pull`; keep the project's framework preset off (see README).

      - uses: oven-sh/setup-bun@v2
        with:
          # Pinned to match Vercel's build image; see the note in e2e.yml.
          bun-version: 1.3.14

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Vercel CLI
        run: npm install --global vercel@62

      - name: Pull project settings
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build
        run: vercel build --prod --token="$VERCEL_TOKEN"

      # ── 3. Deploy ─────────────────────────────────────────────────────────

      - name: Deploy to production
        run: |
          url="$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")"
          echo "Deployed ${url}"
          echo "### API released: ${{ needs.gate.outputs.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "${url}" >> "$GITHUB_STEP_SUMMARY"

      - name: Migration state
        if: always() && env.DIRECT_URL != ''
        run: bash apps/server/scripts/migrate.sh status
