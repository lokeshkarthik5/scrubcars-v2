# The first CI workflow in this repo.
#
# Runs the Playwright suite against production builds of all three frontends
# and a real API, backed by a throwaway Postgres. Deployment stays on Vercel;
# this only gates correctness.
name: E2E

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        # PostGIS, not plain Postgres: migration 0022 adds generated
        # gis.geography columns. The official image is amd64, which is what
        # these runners are, so no emulation here.
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: detlio
          POSTGRES_PASSWORD: detlio
          POSTGRES_DB: detlio_e2e
        ports: ['55432:5432']
        options: >-
          --health-cmd "pg_isready -U detlio -d detlio_e2e"
          --health-interval 5s --health-timeout 5s --health-retries 20

      # Stands in for Cloudflare R2 so upload paths are exercised rather than
      # asserted as a 503.
      minio:
        image: minio/minio:RELEASE.2025-04-22T22-12-26Z
        env:
          MINIO_ROOT_USER: detlio
          MINIO_ROOT_PASSWORD: detlio-secret
        ports: ['9000:9000']

    env:
      # Everything the app reads comes from apps/e2e/.env.e2e, which is
      # committed and secret-free. Only CI-specific values are set here.
      CI: 'true'

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          # Pinned deliberately. Vercel's build image ships 1.3.14 and cannot
          # read the lockfileVersion 2 that bun 1.4 writes, so a CI run on 1.4
          # would rewrite the lockfile and break deploys. See README.
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browser
        run: bunx playwright install --with-deps chromium
        working-directory: apps/e2e

      - name: Ensure psql is available
        # The migration runner shells out to psql; the runner image ships the
        # client but not necessarily on PATH for every image version.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Create the storage bucket
        run: |
          curl -sSL https://dl.min.io/client/mc/release/linux-amd64/mc -o /usr/local/bin/mc
          chmod +x /usr/local/bin/mc
          mc alias set local http://localhost:9000 detlio detlio-secret
          mc mb --ignore-existing local/detlio-e2e
          mc anonymous set download local/detlio-e2e

      - name: Typecheck
        run: bun run typecheck

      - name: Unit tests
        run: bun run test

      - name: Build
        # CI serves production builds rather than `next dev`: compile-on-first-hit
        # is the largest source of timeout flake in this suite.
        run: bun run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8080/api/v1
          NEXT_PUBLIC_RAZORPAY_KEY_ID: rzp_test_e2e

      - name: E2E
        # On a pull request only the @p0 specs run, so feedback stays quick;
        # main gets the whole suite.
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            bun run test:e2e:p0
          else
            bun run test:e2e
          fi

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/e2e/playwright-report/
            apps/e2e/test-results/
          retention-days: 7
