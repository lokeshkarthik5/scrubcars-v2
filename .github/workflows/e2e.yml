# The first CI workflow in this repo.
#
# Runs the Playwright suite against production builds of all three frontends
# and a real API, backed by a throwaway Postgres. Deployment stays on Vercel;
# this only gates correctness.
#
# Expo apps (users-app / vendors-app) are not in the Playwright surface. A
# change set that only touches those folders skips the suite — even when
# bun.lock also moves, which Expo installs always do. Manual runs
# (workflow_dispatch) always run.
name: E2E

on:
  pull_request:
  push:
    branches: [main]
  # Pull requests run only the @p0 specs, so anything outside that tag cannot
  # be verified on a branch. This runs the full suite on demand — which is what
  # you want when the thing you are changing is a test that main runs and a
  # pull request does not.
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      e2e: ${{ steps.set.outputs.e2e }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name != 'workflow_dispatch'
        with:
          filters: |
            e2e:
              - 'apps/users/**'
              - 'apps/vendors/**'
              - 'apps/admin/**'
              - 'apps/server/**'
              - 'apps/e2e/**'
              - 'packages/**'
              - 'package.json'
              - 'turbo.json'
              - '.github/workflows/e2e.yml'
              # Omit apps/users-app, apps/vendors-app, and bun.lock on purpose.

      - id: set
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "${{ steps.filter.outputs.e2e }}" = "true" ]; then
            echo "e2e=true" >> "$GITHUB_OUTPUT"
          else
            echo "e2e=false" >> "$GITHUB_OUTPUT"
          fi

  e2e_run:
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        # PostGIS, not plain Postgres: migration 0022 adds generated
        # gis.geography columns. The official image is amd64, which is what
        # these runners are, so no emulation here.
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: detlio
          POSTGRES_PASSWORD: detlio
          POSTGRES_DB: detlio_e2e
        ports: ['55432:5432']
        options: >-
          --health-cmd "pg_isready -U detlio -d detlio_e2e"
          --health-interval 5s --health-timeout 5s --health-retries 20


    env:
      # Everything the app reads comes from apps/e2e/.env.e2e, which is
      # committed and secret-free. Only CI-specific values are set here.
      CI: 'true'

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          # Pinned deliberately. Vercel's build image ships 1.3.14 and cannot
          # read the lockfileVersion 2 that bun 1.4 writes, so a CI run on 1.4
          # would rewrite the lockfile and break deploys. See README.
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browser
        run: bunx playwright install --with-deps chromium
        working-directory: apps/e2e

      - name: Ensure psql is available
        # The migration runner shells out to psql; the runner image ships the
        # client but not necessarily on PATH for every image version.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Start object storage
        # Stands in for Cloudflare R2 so upload paths are exercised rather than
        # asserted as a 503.
        #
        # Run here rather than as a service container: MinIO only starts when
        # given `server /data`, and GitHub's `services:` block can override a
        # container's options but not its command — so as a service it starts
        # and never listens. Postgres stays a service because it needs no
        # command.
        #
        # pgsty/minio, not minio/minio: MinIO withdrew its free images and
        # binaries (Docker Hub, quay.io and dl.min.io now refuse anonymous
        # pulls), which failed this step on every run. pgsty/minio is the
        # community-maintained build of the same server — same binary, same
        # `server /data`, same health endpoint — and ships `mc` inside it.
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=detlio \
            -e MINIO_ROOT_PASSWORD=detlio-secret \
            pgsty/minio:RELEASE.2026-08-04T00-00-00Z server /data

          for i in $(seq 1 30); do
            if curl -sf http://localhost:9000/minio/health/live >/dev/null; then
              echo "minio ready after ${i} attempt(s)"
              exit 0
            fi
            sleep 2
          done
          echo "minio did not become ready" >&2
          docker logs minio >&2
          exit 1

      - name: Create the storage buckets
        # Through the `mc` bundled in the server image — the standalone client
        # download at dl.min.io is gone too.
        run: |
          docker exec minio mc alias set local http://localhost:9000 detlio detlio-secret
          docker exec minio mc mb --ignore-existing local/detlio-e2e
          docker exec minio mc anonymous set download local/detlio-e2e
          # Garage documents (R2_DOCS_BUCKET): private, as in production.
          docker exec minio mc mb --ignore-existing local/detlio-e2e-docs

      - name: Typecheck
        run: bun run typecheck

      - name: Unit tests
        run: bun run test

      - name: Build
        # CI serves production builds rather than `next dev`: compile-on-first-hit
        # is the largest source of timeout flake in this suite.
        run: bun run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8080/api/v1
          NEXT_PUBLIC_RAZORPAY_KEY_ID: rzp_test_e2e
          # Matches apps/e2e/.env.e2e, which the build does not read. On, so
          # the Home hub's @p0 specs run against it; production stays off.
          NEXT_PUBLIC_HOME_HUB: 'on'
          # Matches apps/e2e/.env.e2e: a made-up Clarity project, so the
          # consent spec sees Clarity load after Allow (the request itself is
          # blocked) and admin's Behaviour tab shows its link.
          NEXT_PUBLIC_CLARITY_ID: e2eclarity01

      - name: E2E
        # On a pull request only the @p0 specs run, so feedback stays quick;
        # main gets the whole suite.
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            bun run test:e2e:p0
          else
            bun run test:e2e
          fi

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/e2e/playwright-report/
            apps/e2e/test-results/
          retention-days: 7

  # Always reports. Keeps the check name `E2E / e2e` green when the suite
  # was skipped (Expo-only PR); a skipped job alone would block a required
  # status check.
  e2e:
    needs: [changes, e2e_run]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require E2E only when the change set needs it
        run: |
          if [ "${{ needs.changes.result }}" != "success" ]; then
            echo "Path filter job failed: ${{ needs.changes.result }}" >&2
            exit 1
          fi
          if [ "${{ needs.changes.outputs.e2e }}" != "true" ]; then
            echo "Skipping E2E — no web, API, package, or e2e workflow changes."
            exit 0
          fi
          if [ "${{ needs.e2e_run.result }}" = "success" ]; then
            exit 0
          fi
          echo "E2E job result: ${{ needs.e2e_run.result }}" >&2
          exit 1
