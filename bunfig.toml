[test]
# `bun test` walks the whole repo and matches *.spec.ts as well as *.test.ts,
# which means it also picks up apps/e2e — Playwright specs that import
# @playwright/test and cannot run under bun's runner.
#
# apps/server holds most of the bun tests, so a bare `bun test` at the root
# points straight at it. packages/core has its own (the pure helpers the web
# apps share) and runs them with `bun test` from its own directory. The
# monorepo entry point remains `bun run test` (turbo), which runs each
# package's own test script and so covers both.
root = "apps/server"
