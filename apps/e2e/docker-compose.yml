# Disposable backing services for the E2E suite.
#
# Nothing here is shared with development: the database listens on 5433 so it
# cannot be confused with a local dev Postgres on 5432, and every run drops and
# recreates its schema. `docker compose down -v` leaves no trace.
name: detlio-e2e

services:
  postgres:
    # PostGIS, not plain Postgres — migration 0022 creates generated
    # `gis.geography` columns on vendors and user_addresses.
    #
    # The official image is amd64-only, which means Rosetta emulation on Apple
    # Silicon. CI runners are amd64 so they get it natively. On an M-series Mac,
    # export E2E_POSTGRES_IMAGE=imresamu/postgis:16-3.4 for a native arm64
    # build of the same Postgres 16 + PostGIS 3.4.
    image: ${E2E_POSTGRES_IMAGE:-postgis/postgis:16-3.4}
    environment:
      POSTGRES_USER: detlio
      POSTGRES_PASSWORD: detlio
      POSTGRES_DB: detlio_e2e
    ports:
      # 5432 and 5433 commonly hold a developer's own Postgres; 55432 does not.
      - '${E2E_POSTGRES_PORT:-55432}:5432'
    # tmpfs keeps the whole database in memory: the suite drops and reseeds it
    # on every run, so durability buys nothing and costs I/O.
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U detlio -d detlio_e2e']
      interval: 2s
      timeout: 3s
      retries: 30

  # Stands in for Cloudflare R2. lib/storage.ts is plain S3-compatible SDK
  # usage, so presigned PUTs work against MinIO unchanged — which turns photo,
  # logo and avatar upload from "assert the 503" into real coverage.
  #
  # pgsty/minio is the community-maintained build of MinIO: the official
  # minio/minio and minio/mc images can no longer be pulled anonymously.
  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: detlio
      MINIO_ROOT_PASSWORD: detlio-secret
    ports:
      - '9000:9000'
      - '9001:9001'
    tmpfs:
      - /data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 2s
      timeout: 3s
      retries: 30

  # One-shot: creates the bucket and makes it publicly readable, because
  # R2_PUBLIC_BASE_URL is served straight to the browser as an <img> src.
  # Also the garage documents bucket (R2_DOCS_BUCKET), left private as in
  # production: its files are only read through presigned links.
  # The server image ships `mc`, so it doubles as the client here.
  minio-init:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 detlio detlio-secret &&
      mc mb --ignore-existing local/detlio-e2e &&
      mc anonymous set download local/detlio-e2e &&
      mc mb --ignore-existing local/detlio-e2e-docs
      "
